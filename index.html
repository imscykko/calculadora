<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Calculadora</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #26345f 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #4b235e 0%, transparent 35%),
                linear-gradient(135deg, #080b14, #151827, #0b0e18);

            overflow: hidden;
        }

        /* Luzes decorativas */

        body::before {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            border-radius: 50%;

            background: rgba(70, 120, 255, 0.12);

            filter: blur(40px);

            top: -80px;
            left: -80px;

            animation: luzAzul 7s ease-in-out infinite alternate;
        }

        body::after {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            border-radius: 50%;

            background: rgba(180, 70, 255, 0.12);

            filter: blur(40px);

            bottom: -80px;
            right: -80px;

            animation: luzRoxa 8s ease-in-out infinite alternate;
        }

        /* Calculadora */

        .calculadora {

            position: relative;
            z-index: 2;

            width: 350px;

            padding: 20px;

            border-radius: 28px;

            background: rgba(25, 28, 40, 0.85);

            border: 1px solid rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.5);

            animation: aparecer 0.7s ease;
        }

        /* Display */

        .display {

            width: 100%;
            height: 100px;

            margin-bottom: 18px;

            padding: 20px;

            display: flex;
            justify-content: flex-end;
            align-items: flex-end;

            background: rgba(0, 0, 0, 0.35);

            border-radius: 20px;

            border: 1px solid rgba(255, 255, 255, 0.06);

            color: white;

            font-size: 38px;
            font-weight: bold;

            overflow: hidden;

            transition: 0.2s;
        }

        /* Animação do display */

        .display.animar {
            animation: displayPop 0.2s ease;
        }

        /* Área dos botões */

        .botoes {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 11px;
        }

        /* Botões */

        button {

            height: 68px;

            border: none;

            border-radius: 18px;

            font-size: 21px;
            font-weight: bold;

            color: white;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.06);

            cursor: pointer;

            box-shadow:
                inset 0 1px rgba(255, 255, 255, 0.05),
                0 6px 15px rgba(0, 0, 0, 0.2);

            transition:
                transform 0.12s,
                background 0.2s,
                box-shadow 0.2s;
        }

        /* Mouse em cima */

        button:hover {

            background: rgba(255, 255, 255, 0.15);

            transform: translateY(-3px);

            box-shadow:
                0 10px 22px rgba(0, 0, 0, 0.3);
        }

        /* Clique */

        button:active {

            transform: scale(0.90);

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.3);
        }

        /* Operadores */

        .operador {

            background: linear-gradient(
                145deg,
                #ff9f2f,
                #ed6f00
            );
        }

        .operador:hover {

            background: linear-gradient(
                145deg,
                #ffb04d,
                #f17c10
            );

            box-shadow:
                0 0 20px rgba(255, 145, 30, 0.35);
        }

        /* Botões especiais */

        .limpar {

            background: rgba(255, 255, 255, 0.14);
        }

        .igual {

            background: linear-gradient(
                145deg,
                #347cff,
                #2254db
            );
        }

        .igual:hover {

            background: linear-gradient(
                145deg,
                #4c8cff,
                #3265e5
            );

            box-shadow:
                0 0 22px rgba(50, 110, 255, 0.4);
        }

        /* Botão zero maior */

        .zero {

            grid-column: span 2;
        }

        /* =========================
           ANIMAÇÕES
        ========================= */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(40px)
                    scale(0.95);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes displayPop {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);

                box-shadow:
                    0 0 25px rgba(70, 130, 255, 0.15);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes luzAzul {

            from {

                transform:
                    translate(0, 0);
            }

            to {

                transform:
                    translate(50px, 35px);
            }
        }

        @keyframes luzRoxa {

            from {

                transform:
                    translate(0, 0);
            }

            to {

                transform:
                    translate(-45px, -35px);
            }
        }

    </style>
</head>


<body>


    <div class="calculadora">


        <!-- Display -->

        <div
            class="display"
            id="display">

            0

        </div>


        <!-- Botões -->

        <div class="botoes">


            <button
                class="limpar"
                onclick="limpar()">

                AC

            </button>


            <button
                onclick="porcentagem()">

                %

            </button>


            <button
                onclick="mudarSinal()">

                ±

            </button>


            <button
                class="operador"
                onclick="operacao('/')">

                ÷

            </button>


            <button
                onclick="numero('7')">

                7

            </button>


            <button
                onclick="numero('8')">

                8

            </button>


            <button
                onclick="numero('9')">

                9

            </button>


            <button
                class="operador"
                onclick="operacao('*')">

                ×

            </button>


            <button
                onclick="numero('4')">

                4

            </button>


            <button
                onclick="numero('5')">

                5

            </button>


            <button
                onclick="numero('6')">

                6

            </button>


            <button
                class="operador"
                onclick="operacao('-')">

                −

            </button>


            <button
                onclick="numero('1')">

                1

            </button>


            <button
                onclick="numero('2')">

                2

            </button>


            <button
                onclick="numero('3')">

                3

            </button>


            <button
                class="operador"
                onclick="operacao('+')">

                +

            </button>


            <button
                class="zero"
                onclick="numero('0')">

                0

            </button>


            <button
                onclick="numero('.')">

                .

            </button>


            <button
                class="igual"
                onclick="calcular()">

                =

            </button>


        </div>


    </div>


    <script>


        let numeroAtual = "";

        let numeroAnterior = "";

        let operador = "";

        let resetar = false;


        /* =========================
           NÚMEROS
        ========================= */

        function numero(valor) {


            if (resetar) {

                numeroAtual = "";

                resetar = false;

            }


            // Impede dois pontos

            if (
                valor === "." &&
                numeroAtual.includes(".")
            ) {

                return;

            }


            // Limita o tamanho

            if (numeroAtual.length >= 15) {

                return;

            }


            numeroAtual += valor;


            atualizarDisplay();

        }


        /* =========================
           OPERAÇÃO
        ========================= */

        function operacao(valor) {


            if (numeroAtual === "") {

                return;

            }


            numeroAnterior = numeroAtual;

            operador = valor;

            numeroAtual = "";

        }


        /* =========================
           CALCULAR
        ========================= */

        function calcular() {


            if (
                numeroAnterior === "" ||
                numeroAtual === "" ||
                operador === ""
            ) {

                return;

            }


            let primeiroNumero =
                Number(numeroAnterior);


            let segundoNumero =
                Number(numeroAtual);


            let resultado;


            if (operador === "+") {

                resultado =
                    primeiroNumero +
                    segundoNumero;

            }


            else if (operador === "-") {

                resultado =
                    primeiroNumero -
                    segundoNumero;

            }


            else if (operador === "*") {

                resultado =
                    primeiroNumero *
                    segundoNumero;

            }


            else if (operador === "/") {


                if (segundoNumero === 0) {

                    numeroAtual = "Erro";

                    numeroAnterior = "";

                    operador = "";

                    resetar = true;

                    atualizarDisplay();

                    return;

                }


                resultado =
                    primeiroNumero /
                    segundoNumero;

            }


            // Evita números gigantes

            resultado =
                Number(resultado.toFixed(10));


            numeroAtual =
                resultado.toString();


            numeroAnterior = "";

            operador = "";

            resetar = true;


            atualizarDisplay();

        }


        /* =========================
           LIMPAR
        ========================= */

        function limpar() {


            numeroAtual = "";

            numeroAnterior = "";

            operador = "";

            resetar = false;


            atualizarDisplay();

        }


        /* =========================
           PORCENTAGEM
        ========================= */

        function porcentagem() {


            if (numeroAtual === "") {

                return;

            }


            numeroAtual =
                (
                    Number(numeroAtual) / 100
                ).toString();


            atualizarDisplay();

        }


        /* =========================
           MUDAR SINAL
        ========================= */

        function mudarSinal() {


            if (
                numeroAtual !== "" &&
                numeroAtual !== "0" &&
                numeroAtual !== "Erro"
            ) {

                numeroAtual =
                    (
                        Number(numeroAtual) * -1
                    ).toString();


                atualizarDisplay();

            }

        }


        /* =========================
           ATUALIZAR DISPLAY
        ========================= */

        function atualizarDisplay() {


            let display =
                document.getElementById(
                    "display"
                );


            display.innerText =
                numeroAtual === ""
                    ? "0"
                    : numeroAtual;


            // Reinicia a animação

            display.classList.remove(
                "animar"
            );


            void display.offsetWidth;


            display.classList.add(
                "animar"
            );

        }


        /* =========================
           TECLADO DO PC
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {


                // Números

                if (
                    event.key >= "0" &&
                    event.key <= "9"
                ) {

                    numero(event.key);

                }


                // Ponto

                else if (
                    event.key === "."
                ) {

                    numero(".");

                }


                // Operadores

                else if (
                    event.key === "+" ||
                    event.key === "-" ||
                    event.key === "*" ||
                    event.key === "/"
                ) {

                    operacao(event.key);

                }


                // Enter = calcular

                else if (
                    event.key === "Enter" ||
                    event.key === "="
                ) {

                    calcular();

                }


                // ESC = limpar

                else if (
                    event.key === "Escape"
                ) {

                    limpar();

                }


                // %

                else if (
                    event.key === "%"
                ) {

                    porcentagem();

                }

            }
        );


    </script>


</body>

</html>
